<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shubho Bibaho</title>
<meta name="description" content="Light the lamp to open your wedding invitation.">
<meta property="og:title" content="শুভ বিবাহ 🪔">
<meta property="og:description" content="Light the lamp to open your wedding invitation.">
<meta name="theme-color" content="#a3121c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Bengali:wght@400;600;800&family=Rozha+One&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../fonts/lipighor.css?v=1">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body class="locked">

<!-- ============ LIGHT THE DIYA (opening screen) ============ -->
<section class="intro" id="intro">
  <button class="pill lang-pos" data-lang-toggle></button>
  <p class="intro-dear" id="dear"></p>
  <div class="glow" id="glow" aria-hidden="true"></div>
  <button class="diya" id="diya" aria-label="Press and hold to light the lamp">
    <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56"/><circle class="prog" id="prog" cx="60" cy="60" r="56"/></svg>
    <span class="flame" aria-hidden="true"><i></i></span>
    <svg class="lamp" viewBox="0 0 120 70" aria-hidden="true">
      <defs><linearGradient id="clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e08a3c"/><stop offset="1" stop-color="#8a3d14"/></linearGradient></defs>
      <path d="M8 22 Q60 30 104 18 L116 12 Q112 26 104 32 Q86 62 60 64 Q30 64 14 40 Q8 32 8 22Z" fill="url(#clay)"/>
      <path d="M8 22 Q60 34 104 18" fill="none" stroke="#5c250a" stroke-width="2"/>
      <path d="M28 44 q8 6 16 0 q8 -6 16 0 q8 6 16 0 q8 -6 16 0" fill="none" stroke="#f6d27a" stroke-width="2" opacity=".85"/>
      <circle cx="60" cy="54" r="3" fill="#f6d27a"/>
      <path d="M100 16 q4 -8 2 -14" stroke="#3a1a08" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </svg>
  </button>
  <p class="intro-hint" id="hint" data-i18n="hold"></p>
  <button class="skip" id="skipBtn" data-i18n="skip"></button>
</section>

<!-- ============ INVITATION ============ -->
<div class="border left" aria-hidden="true"></div>
<div class="border right" aria-hidden="true"></div>

<main class="page" id="page" hidden>
  <div class="top-bar">
    <button class="pill" id="musicBtn" hidden aria-label="Music on/off">♪</button>
    <button class="pill" data-lang-toggle></button>
  </div>

  <header class="hero">
    <svg class="alpana" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="#a3121c" stroke-width="2">
        <circle cx="100" cy="100" r="92"/><circle cx="100" cy="100" r="84" stroke-dasharray="2 6" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="30"/><circle cx="100" cy="100" r="18" fill="#a3121c" fill-opacity=".1"/>
      </g>
      <g id="petal" fill="#a3121c" fill-opacity=".9"><path d="M100 70 C92 55 92 40 100 26 C108 40 108 55 100 70Z"/></g>
      <use href="#petal" transform="rotate(45 100 100)"/><use href="#petal" transform="rotate(90 100 100)"/><use href="#petal" transform="rotate(135 100 100)"/>
      <use href="#petal" transform="rotate(180 100 100)"/><use href="#petal" transform="rotate(225 100 100)"/><use href="#petal" transform="rotate(270 100 100)"/><use href="#petal" transform="rotate(315 100 100)"/>
      <g fill="#d4a13a"><circle cx="100" cy="100" r="6"/></g>
    </svg>
    <p class="blessing" id="blessing"></p>
    <h1 class="shubho" data-i18n="shubho"></h1>
    <p class="msg" id="message"></p>
    <div class="l-photo"><img data-photo alt=""></div>
    <div class="names">
      <div><span class="nm" id="gName"></span><span class="par" id="gParents"></span></div>
      <span class="weds" data-i18n="weds"></span>
      <div><span class="nm" id="bName"></span><span class="par" id="bParents"></span></div>
    </div>
  </header>

  <section class="sec fade">
    <h2 class="h2" data-i18n="schedule"></h2>
    <div class="rows" id="events"></div>
  </section>

  <section class="sec fade">
    <p class="label" data-i18n="countdownTo"></p>
    <h2 class="h2" id="cdTitle"></h2>
    <div class="cd" id="cd">
      <div><b data-cd="d">0</b><span data-i18n="days"></span></div>
      <div><b data-cd="h">0</b><span data-i18n="hours"></span></div>
      <div><b data-cd="m">0</b><span data-i18n="minutes"></span></div>
      <div><b data-cd="s">0</b><span data-i18n="seconds"></span></div>
    </div>
    <p class="done" id="cdDone" hidden data-i18n="married"></p>
  </section>

  <section class="sec fade" id="gallerySec" hidden>
    <h2 class="h2" data-i18n="moments"></h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="sec fade" id="rsvpSec">
    <h2 class="h2" data-i18n="rsvpH"></h2>
    <p class="msg small" id="deadline"></p>
    <form class="rsvp" id="rsvpForm" novalidate>
      <label><span data-i18n="yourName"></span><input id="rName" name="name" maxlength="60" autocomplete="name"></label>
      <div class="choice">
        <label><input type="radio" name="attending" value="yes" checked><span data-i18n="accept"></span></label>
        <label><input type="radio" name="attending" value="no"><span data-i18n="decline"></span></label>
      </div>
      <label id="guestsWrap"><span data-i18n="guests"></span>
        <select name="guests"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select>
      </label>
      <label><span data-i18n="wish"></span><textarea name="message" rows="3" maxlength="200"></textarea></label>
      <button class="btn" type="submit" data-i18n="send"></button>
      <p class="status" id="status" role="status"></p>
    </form>
  </section>

  <section class="sec fade end">
    <p class="label" data-i18n="contact"></p>
    <div class="contacts" id="contacts"></div>
    <p class="msg" id="closing"></p>
    <p class="sign" id="sign"></p>
    <p class="tag" id="hashtag"></p>
    <p class="credit">Made with ♥ by <a id="brand" href="https://shubhochithi.com/?ref=card" target="_blank" rel="noopener"></a> · <span class="lipighor-credit">Web font: <a href="https://lipighor.com" target="_blank" rel="noopener">lipighor.com</a></span></p>
  </section>
</main>

<div class="rotate-msg" data-i18n="rotate"></div>
<audio id="music" loop preload="none"></audio>
<script src="data.js"></script>
<script src="../shared/media.js?v=2"></script>
<script src="app.js?v=3"></script>
</body>
</html>
