<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Illustration of a Bangladeshi bride and groom">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf3e4"/><stop offset="1" stop-color="#f6dfc4"/></linearGradient>
    <linearGradient id="saree" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8102e"/><stop offset="1" stop-color="#8e0c22"/></linearGradient>
    <linearGradient id="sherwani" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf1dc"/><stop offset="1" stop-color="#e8d3a8"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dd9b"/><stop offset=".5" stop-color="#d9a441"/><stop offset="1" stop-color="#a8792a"/></linearGradient>
    <pattern id="zari" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d9a441"/><circle cx="5" cy="5" r="1.8" fill="#f6dd9b"/></pattern>
    <clipPath id="arch"><path d="M40 500V190C40 100 120 40 200 22c80 18 160 78 160 168v310z"/></clipPath>
  </defs>

  <!-- Arch backdrop -->
  <rect width="400" height="500" fill="#7a1f2b"/>
  <g clip-path="url(#arch)">
    <rect width="400" height="500" fill="url(#bg)"/>
    <!-- soft sun / halo -->
    <circle cx="200" cy="190" r="120" fill="#fbe3b8" opacity=".7"/>
    <!-- marigold strings -->
    <g fill="#f29d12">
      <g id="str"><circle cx="70" cy="60" r="7"/><circle cx="70" cy="76" r="7" fill="#e8560e"/><circle cx="70" cy="92" r="7"/><circle cx="70" cy="108" r="7" fill="#e8560e"/><circle cx="70" cy="124" r="7"/><circle cx="70" cy="140" r="7" fill="#e8560e"/><circle cx="70" cy="156" r="7"/><circle cx="70" cy="172" r="6" fill="#fff"/></g>
      <use href="#str" x="40" y="-30"/><use href="#str" x="220" y="-30"/><use href="#str" x="260"/>
    </g>
    <!-- floor -->
    <ellipse cx="200" cy="500" rx="210" ry="40" fill="#e9c79c"/>
    <g fill="#e8560e" opacity=".8"><circle cx="90" cy="478" r="4"/><circle cx="300" cy="482" r="4"/><circle cx="140" cy="488" r="3"/><circle cx="260" cy="470" r="3"/><circle cx="330" cy="470" r="3" fill="#f29d12"/><circle cx="70" cy="466" r="3" fill="#f29d12"/></g>

    <!-- ===== Groom (right) ===== -->
    <g>
      <!-- body / sherwani -->
      <path d="M212 262c10-18 34-26 56-26s46 8 56 26l22 238H190z" fill="url(#sherwani)"/>
      <path d="M268 240v260" stroke="#c9a24f" stroke-width="2"/>
      <g fill="url(#gold)"><circle cx="268" cy="270" r="3"/><circle cx="268" cy="294" r="3"/><circle cx="268" cy="318" r="3"/><circle cx="268" cy="342" r="3"/></g>
      <path d="M248 236c6 10 14 14 20 14s14-4 20-14" fill="none" stroke="#c9a24f" stroke-width="3"/>
      <!-- maroon stole over shoulder -->
      <path d="M300 246c-6 40-14 100-40 170l-18-6c24-60 34-118 38-168z" fill="#8e0c22"/>
      <path d="M296 248c-6 40-14 98-38 164" stroke="#d9a441" stroke-width="2" fill="none"/>
      <!-- neck + head -->
      <rect x="258" y="206" width="20" height="34" rx="8" fill="#b97a52"/>
      <ellipse cx="268" cy="182" rx="30" ry="34" fill="#c4865c"/>
      <path d="M245 198c2 20 11 31 23 31s21-11 23-31c-6 9-14 13-23 13s-17-4-23-13z" fill="#2b1a12"/>
      <path d="M258 199c4-3 16-3 20 0" stroke="#2b1a12" stroke-width="3" stroke-linecap="round" fill="none"/>
      <ellipse cx="238" cy="184" rx="5" ry="8" fill="#b97a52"/>
      <!-- pagri (turban) -->
      <path d="M234 170c-4-34 16-56 34-56s40 20 34 56c-10-8-22-12-34-12s-24 4-34 12z" fill="#a3122a"/>
      <path d="M236 160c10-10 22-14 32-14s24 4 32 14" stroke="url(#gold)" stroke-width="4" fill="none"/>
      <path d="M240 140c12-8 22-10 28-10s18 2 28 10" stroke="#d9a441" stroke-width="2" fill="none" opacity=".8"/>
      <circle cx="268" cy="146" r="6" fill="url(#gold)"/>
      <path d="M268 140c-2-16 4-28 14-34-4 12-6 22-8 34z" fill="#fbf1dc" stroke="#d9a441" stroke-width="1.5"/>
      <!-- groom hand holding the bride's hand -->
      <ellipse cx="212" cy="378" rx="11" ry="8" fill="#b97a52"/>
    </g>

    <!-- ===== Bride (left) ===== -->
    <g>
      <!-- saree body -->
      <path d="M96 290c6-30 30-46 58-46s50 16 58 46l26 210H70z" fill="url(#saree)"/>
      <!-- pleats + gold border at hem -->
      <path d="M78 470h168l4 30H74z" fill="url(#zari)"/>
      <path d="M150 330l-10 140M168 330l2 140M186 330l14 140" stroke="#7a0a1d" stroke-width="2" opacity=".5"/>
      <!-- pallu across body with zari border -->
      <path d="M200 250c-30 40-70 90-104 150l-12-16c34-58 72-104 98-142z" fill="#b10e2a"/>
      <path d="M196 254c-28 40-66 88-98 144" stroke="url(#gold)" stroke-width="6" fill="none"/>
      <!-- neck, head -->
      <rect x="144" y="218" width="18" height="30" rx="8" fill="#c98a62"/>
      <ellipse cx="153" cy="196" rx="27" ry="31" fill="#d0946b"/>
      <!-- hair -->
      <path d="M126 196c0-24 12-36 27-36s27 12 27 36c-6-12-16-18-27-18s-21 6-27 18z" fill="#24140d"/>
      <!-- ghomta (veil) -->
      <path d="M116 214c-4-50 14-80 37-80s44 28 40 78c-2-28-18-48-40-48s-34 22-37 50z" fill="#c8102e"/>
      <path d="M118 210c0-44 14-70 35-70s38 24 38 68" stroke="url(#gold)" stroke-width="5" fill="none"/>
      <path d="M116 214c-10 40-12 70-6 100l14-4c-4-28-2-56 4-90z" fill="#a50d27"/>
      <!-- tikli + jewellery -->
      <path d="M153 162v12" stroke="#d9a441" stroke-width="2"/>
      <circle cx="153" cy="178" r="4.5" fill="url(#gold)"/>
      <circle cx="166" cy="204" r="2.4" fill="#f6dd9b"/>
      <path d="M136 244c6 12 30 12 36 0" stroke="url(#gold)" stroke-width="5" fill="none"/>
      <circle cx="154" cy="254" r="4" fill="#c8102e" stroke="#d9a441" stroke-width="2"/>
      <circle cx="128" cy="206" r="4" fill="url(#gold)"/>
      <!-- bride arm with mehendi hand holding groom's hand -->
      <path d="M186 300c8 26 10 48 10 66l-14 2c0-18-2-38-10-60z" fill="#c8102e"/>
      <ellipse cx="196" cy="372" rx="12" ry="9" fill="#a55a35"/>
      <path d="M190 370c4-2 8-2 12 0M190 375c4 2 8 2 12 0" stroke="#6b2f17" stroke-width="1.4" fill="none"/>
      <g fill="url(#gold)"><rect x="180" y="356" width="14" height="4" rx="2"/><rect x="180" y="361" width="14" height="3" rx="1.5" fill="#c8102e"/></g>
    </g>

    <!-- tiny hearts -->
    <path d="M200 92l-8-8a5 5 0 0 1 8-6 5 5 0 0 1 8 6z" fill="#c8102e" opacity=".55"/>
  </g>

  <!-- Gold arch frame -->
  <path d="M40 500V190C40 100 120 40 200 22c80 18 160 78 160 168v310" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <path d="M54 500V194c0-80 72-134 146-152 74 18 146 72 146 152v306" fill="none" stroke="#f6dd9b" stroke-width="1.5" opacity=".7"/>
  <circle cx="200" cy="22" r="8" fill="url(#gold)"/>
</svg>
