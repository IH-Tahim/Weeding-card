<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<meta name="description" content="Open the linen doors to see your wedding invitation.">
<meta property="og:title" content="You're invited 🌿">
<meta property="og:description" content="Open the linen doors to see your wedding invitation.">
<meta name="theme-color" content="#6f7f5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hind+Siliguri:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../fonts/lipighor.css?v=2">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body class="locked">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- woven linen texture -->
  <filter id="linen" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9 0.06" numOctaves="2" seed="4" result="h"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.06 0.9" numOctaves="2" seed="9" result="v"/>
    <feBlend in="h" in2="v" mode="multiply" result="w"/>
    <feColorMatrix in="w" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g"><feFuncA type="linear" slope=".38"/></feComponentTransfer>
  </filter>
  <!-- raised, embossed leaves on the doors -->
  <filter id="raise" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/>
    <feSpecularLighting in="b" surfaceScale="3" specularConstant=".7" specularExponent="16" lighting-color="#e9f0dc" result="s"><fePointLight x="-80" y="-120" z="200"/></feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
    <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
  </filter>
  <symbol id="sprig" viewBox="0 0 120 200">
    <path d="M60 196 C58 150 62 100 60 10" fill="none" stroke="currentColor" stroke-width="3"/>
    <g fill="currentColor">
      <path d="M60 160 C40 150 26 132 24 112 C42 120 56 136 60 160Z"/><path d="M60 160 C80 150 94 132 96 112 C78 120 64 136 60 160Z"/>
      <path d="M60 120 C42 110 32 94 32 76 C48 84 58 98 60 120Z"/><path d="M60 120 C78 110 88 94 88 76 C72 84 62 98 60 120Z"/>
      <path d="M60 82 C46 74 38 60 40 44 C52 52 60 64 60 82Z"/><path d="M60 82 C74 74 82 60 80 44 C68 52 60 64 60 82Z"/>
      <path d="M60 46 C52 38 50 26 54 14 C62 22 64 34 60 46Z"/>
    </g>
  </symbol>
</svg>

<!-- ============ LINEN DOORS (opening) ============ -->
<section class="intro" id="intro">
  <button class="pill lang-pos" data-lang-toggle></button>
  <div class="door left" aria-hidden="true">
    <svg class="tex" preserveAspectRatio="none"><rect width="100%" height="100%" filter="url(#linen)"/></svg>
    <svg class="leaves" viewBox="0 0 200 800" preserveAspectRatio="xMidYMid slice"><g filter="url(#raise)" color="#7d8d69"><use href="#sprig" x="10" y="40" width="90" height="150" transform="rotate(-18 55 115)"/><use href="#sprig" x="70" y="300" width="110" height="190" transform="rotate(14 125 395)"/><use href="#sprig" x="0" y="560" width="100" height="170" transform="rotate(-10 50 645)"/></g></svg>
  </div>
  <div class="door right" aria-hidden="true">
    <svg class="tex" preserveAspectRatio="none"><rect width="100%" height="100%" filter="url(#linen)"/></svg>
    <svg class="leaves" viewBox="0 0 200 800" preserveAspectRatio="xMidYMid slice"><g filter="url(#raise)" color="#7d8d69"><use href="#sprig" x="90" y="80" width="100" height="170" transform="rotate(16 140 165)"/><use href="#sprig" x="10" y="360" width="100" height="180" transform="rotate(-14 60 450)"/><use href="#sprig" x="100" y="600" width="90" height="150" transform="rotate(10 145 675)"/></g></svg>
  </div>
  <div class="seam" aria-hidden="true"></div>
  <p class="dear" data-f="dear"></p>
  <button class="plaque" id="plaque" aria-label="Open the invitation">
    <svg viewBox="0 0 220 280" aria-hidden="true">
      <defs><linearGradient id="pl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf6ea"/><stop offset="1" stop-color="#ece2cb"/></linearGradient></defs>
      <path d="M110 6 C122 6 126 18 138 20 C160 22 172 10 190 22 C202 32 194 48 204 60 C214 72 214 92 204 104 C196 116 206 128 206 140 C206 152 196 164 204 176 C214 188 214 208 204 220 C194 232 202 248 190 258 C172 270 160 258 138 260 C126 262 122 274 110 274 C98 274 94 262 82 260 C60 258 48 270 30 258 C18 248 26 232 16 220 C6 208 6 188 16 176 C24 164 14 152 14 140 C14 128 24 116 16 104 C6 92 6 72 16 60 C26 48 18 32 30 22 C48 10 60 22 82 20 C94 18 98 6 110 6Z" fill="url(#pl)" stroke="#b8975a" stroke-width="2.5"/>
      <path d="M110 22 C120 22 124 32 134 34 C152 36 162 26 176 36 C186 44 180 56 188 66 C196 76 196 92 188 102 C182 112 190 124 190 140 C190 156 182 168 188 178 C196 188 196 204 188 214 C180 224 186 236 176 244 C162 254 152 244 134 246 C124 248 120 258 110 258 C100 258 96 248 86 246 C68 244 58 254 44 244 C34 236 40 224 32 214 C24 204 24 188 32 178 C38 168 30 156 30 140 C30 124 38 112 32 102 C24 92 24 76 32 66 C40 56 34 44 44 36 C58 26 68 36 86 34 C96 32 100 22 110 22Z" fill="none" stroke="#c9ad74" stroke-width="1"/>
      <g fill="#fffaf0" stroke="#d6c39a" stroke-width=".8"><circle cx="110" cy="8" r="5"/><circle cx="100" cy="12" r="3.5"/><circle cx="120" cy="12" r="3.5"/><circle cx="110" cy="272" r="5"/><circle cx="100" cy="268" r="3.5"/><circle cx="120" cy="268" r="3.5"/></g>
      <g fill="none" stroke="#a88a4e" stroke-width="1.2"><path d="M70 92 H150"/><path d="M70 196 H150"/></g>
      <g color="#9b8148" transform="translate(98 48) scale(.2)"><use href="#sprig" width="120" height="200"/></g>
      <g color="#9b8148" transform="translate(122 232) rotate(180) scale(.2)"><use href="#sprig" width="120" height="200"/></g>
    </svg>
    <span class="pl-mono" data-f="mono"></span>
    <span class="pl-tap" data-i18n="open"></span>
  </button>
</section>

<!-- ============ INVITATION ============ -->
<main class="page" id="page" hidden>
  <div class="vine left" aria-hidden="true"></div>
  <div class="vine right" aria-hidden="true"></div>
  <div class="top-bar"><button class="pill" data-lang-toggle></button></div>

  <header class="hero sec">
    <p class="bismillah" data-show="bismillah">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
    <p class="script-sub" data-i18n="married"></p>
    <h1 class="name" data-f="gShort"></h1>
    <p class="who" data-show="gParents" data-f="gParents"></p>
    <p class="cred" data-show="gTitle" data-f="gTitle"></p>
    <p class="amp">&amp;</p>
    <h1 class="name" data-f="bShort"></h1>
    <p class="who" data-show="bParents" data-f="bParents"></p>
    <p class="cred" data-show="bTitle" data-f="bTitle"></p>
    <div class="divider" aria-hidden="true"><i></i><span>♥</span><i></i></div>
  </header>

  <section class="sec fade">
    <div class="divider" aria-hidden="true"><i></i><span>♥</span><i></i></div>
    <p class="message" data-f="message"></p>
    <div class="divider" aria-hidden="true"><i></i><span>♥</span><i></i></div>
  </section>

  <!-- Scratch the heart to reveal the date -->
  <section class="sec fade">
    <h2 class="title" data-i18n="scratchH"></h2>
    <div class="divider sm" aria-hidden="true"><i></i><span>♥</span><i></i></div>
    <div class="heart-wrap">
      <div class="heart-date">
        <small data-i18n="invitedShort"></small>
        <b data-date="date"></b>
        <span data-date="weekday"></span>
        <span data-date="time"></span>
      </div>
      <canvas id="scratch" aria-label="Scratch to reveal the date"></canvas>
      <p class="scratch-hint" id="scratchHint" data-i18n="scratchHint"></p>
    </div>
    <button class="btn" data-cal-main type="button">📅 <span data-i18n="addCal"></span></button>
  </section>

  <section class="sec fade">
    <figure class="photo"><img data-photo alt=""></figure>
  </section>

  <section class="sec fade">
    <p class="caps" data-i18n="saveDate"></p>
    <h2 class="title" data-i18n="countdown"></h2>
    <div class="cd" data-cd-wrap>
      <span><b data-cd="d">0</b><small data-i18n="days"></small></span>
      <span><b data-cd="h">00</b><small data-i18n="hours"></small></span>
      <span><b data-cd="m">00</b><small data-i18n="minutes"></small></span>
      <span><b data-cd="s">00</b><small data-i18n="seconds"></small></span>
    </div>
    <p class="done" data-cd-done hidden data-i18n="married2"></p>
  </section>

  <section class="sec fade">
    <div class="ic-head" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
    <h2 class="title" data-i18n="timeline"></h2>
    <div class="divider sm" aria-hidden="true"><i></i><span>♥</span><i></i></div>
    <div class="timeline" id="timeline"></div>
  </section>

  <section class="sec fade" data-show="gallery">
    <p class="caps" data-i18n="moments"></p>
    <div class="gallery" data-gallery></div>
  </section>

  <section class="sec fade" id="rsvpSec" data-show="rsvp">
    <p class="caps label" data-i18n="rsvp"></p>
    <h2 class="title" data-i18n="rsvpH"></h2>
    <p class="note" data-deadline></p>
    <form class="rsvp" id="rsvpForm" novalidate>
      <label><span data-i18n="yourName"></span><input name="name" maxlength="60" autocomplete="name"></label>
      <div class="choice">
        <label><input type="radio" name="attending" value="yes" checked><span data-i18n="accept"></span></label>
        <label><input type="radio" name="attending" value="no"><span data-i18n="decline"></span></label>
      </div>
      <label data-guests><span data-i18n="guests"></span>
        <select name="guests"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select>
      </label>
      <label><span data-i18n="wish"></span><textarea name="message" rows="3" maxlength="200"></textarea></label>
      <button class="btn" type="submit" data-i18n="send"></button>
      <p class="status" role="status"></p>
    </form>
  </section>

  <section class="sec fade end">
    <div class="contacts" data-contacts></div>
    <p class="script-sub" data-i18n="cantWait"></p>
    <p class="message" data-f="closing"></p>
    <p class="name small" data-f="couple"></p>
    <p class="tag" data-f="hashtag"></p>
    <p class="credit">Made with ♥ by <a id="brand" data-f="brand" href="https://shubhochithi.com/?ref=card" target="_blank" rel="noopener"></a> · <span class="lipighor-credit">Web font: <a href="https://lipighor.com" target="_blank" rel="noopener">lipighor.com</a></span></p>
  </section>
</main>

<script src="data.js"></script>
<script src="../shared/media.js?v=2"></script>
<script src="../shared/extras.js?v=2"></script>
<script src="../shared/core.js?v=2"></script>
<script src="app.js?v=1"></script>
</body>
</html>
