<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বিয়ের নিমন্ত্রণ</title>
<meta name="description" content="রিকশায় চড়ে আমাদের গল্প — বিয়ের নিমন্ত্রণ।">
<meta property="og:title" content="ক্রিং ক্রিং! বিয়ের দাওয়াত 🛺">
<meta property="og:description" content="Ride the rickshaw through our story and wedding.">
<meta name="theme-color" content="#ffd400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Galada&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../fonts/lipighor.css?v=2">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body class="locked" data-xs-skip="story">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flower" viewBox="0 0 40 40"><g><circle cx="20" cy="8" r="7" fill="#e6007e"/><circle cx="32" cy="20" r="7" fill="#e6007e"/><circle cx="20" cy="32" r="7" fill="#e6007e"/><circle cx="8" cy="20" r="7" fill="#e6007e"/><circle cx="20" cy="20" r="7" fill="#ffd400" stroke="#1b2a6b" stroke-width="2"/></g></symbol>
  <symbol id="rickshawArt" viewBox="0 0 120 90">
    <!-- puller -->
    <g stroke="#1b2a6b" stroke-width="3" stroke-linecap="round" fill="none"><path d="M96 34 L92 56 L84 70 M92 56 L100 70 M94 40 L106 46"/></g>
    <circle cx="97" cy="27" r="6" fill="#8a5a3c"/><path d="M90 24 Q97 16 104 24" fill="#fff" stroke="#1b2a6b" stroke-width="1.5"/>
    <!-- frame -->
    <g stroke="#1b2a6b" stroke-width="3" fill="none" stroke-linecap="round"><path d="M36 66 L60 66 L84 70 L104 50"/><path d="M60 66 L64 48"/></g>
    <!-- hood -->
    <path d="M14 52 C12 22 30 8 52 10 L58 50 Z" fill="#e6007e" stroke="#1b2a6b" stroke-width="2.5"/>
    <path d="M20 46 C20 26 32 16 48 16" fill="none" stroke="#ffd400" stroke-width="3"/>
    <path d="M26 46 C26 30 34 22 46 22" fill="none" stroke="#00a6a6" stroke-width="3"/>
    <!-- couple -->
    <circle cx="44" cy="34" r="6" fill="#8a5a3c"/><path d="M37 33 Q44 22 51 33" fill="#e52521"/><path d="M36 54 Q38 40 44 40 Q50 40 52 54Z" fill="#e52521"/>
    <circle cx="57" cy="32" r="6" fill="#8a5a3c"/><path d="M51 28 L57 20 L63 28Z" fill="#ffd400" stroke="#c7811a" stroke-width="1"/><path d="M50 54 Q52 40 57 40 Q62 40 64 54Z" fill="#fff4dc" stroke="#1b2a6b" stroke-width="1"/>
    <!-- seat & panel -->
    <rect x="16" y="50" width="48" height="10" rx="3" fill="#00a6a6" stroke="#1b2a6b" stroke-width="2"/>
    <rect x="14" y="58" width="22" height="12" rx="2" fill="#ffd400" stroke="#1b2a6b" stroke-width="2"/>
    <circle cx="25" cy="64" r="3" fill="#e6007e"/>
    <!-- wheels -->
    <g class="wheel"><circle cx="36" cy="72" r="14" fill="none" stroke="#1b2a6b" stroke-width="3"/><path d="M36 58V86M22 72H50M26 62L46 82M46 62L26 82" stroke="#1b2a6b" stroke-width="1.4"/></g>
    <g class="wheel"><circle cx="104" cy="76" r="10" fill="none" stroke="#1b2a6b" stroke-width="3"/><path d="M104 66V86M94 76H114" stroke="#1b2a6b" stroke-width="1.4"/></g>
    <!-- tassels -->
    <g stroke="#e52521" stroke-width="2"><path d="M18 52 V60"/><path d="M30 50 V58"/><path d="M42 50 V58"/></g>
  </symbol>
</svg>

<!-- ============ OPENING: the rickshaw's painted back plate ============ -->
<section class="intro" id="intro">
  <button class="pill lang-pos" data-lang-toggle></button>
  <div class="plate" id="plate">
    <div class="plate-in">
      <svg class="fl a" aria-hidden="true"><use href="#flower"/></svg><svg class="fl b" aria-hidden="true"><use href="#flower"/></svg>
      <svg class="fl c" aria-hidden="true"><use href="#flower"/></svg><svg class="fl d" aria-hidden="true"><use href="#flower"/></svg>
      <p class="dear" data-f="dear"></p>
      <p class="plate-title" data-i18n="shubho"></p>
      <p class="plate-names"><span data-f="gShort"></span> <i>♥</i> <span data-f="bShort"></span></p>
      <p class="plate-date" data-date="date"></p>
    </div>
    <div class="fringe" aria-hidden="true"></div>
  </div>
  <button class="bell" id="bell" aria-label="Ring the bell to open">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="34" r="20" fill="#ffd400" stroke="#1b2a6b" stroke-width="3"/><circle cx="32" cy="34" r="12" fill="#ffe680" stroke="#c7a200" stroke-width="2"/><rect x="28" y="8" width="8" height="8" rx="2" fill="#1b2a6b"/><path d="M50 30 L60 24" stroke="#1b2a6b" stroke-width="4" stroke-linecap="round"/></svg>
    <span data-i18n="ring"></span>
  </button>
</section>

<!-- ============ INVITATION ============ -->
<main class="page" id="page" hidden>
  <div class="top-bar"><button class="pill" data-lang-toggle></button></div>

  <header class="hero sec">
    <p class="bismillah" data-show="bismillah">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</p>
    <p class="kicker" data-i18n="golpo"></p>
    <h1 class="names"><span data-f="gShort"></span><em data-i18n="weds"></em><span data-f="bShort"></span></h1>
    <p class="par"><span data-f="gParents"></span><br><span data-f="bParents"></span></p>
    <p class="msg" data-f="message"></p>
    <p class="scroll-cue" data-i18n="ride"></p>
  </header>

  <!-- The road: a rickshaw rides down through our story and every event as you scroll -->
  <section class="journey" id="journey">
    <svg class="road" id="road" aria-hidden="true"><path id="roadPath" class="asphalt"/><path class="lane" id="roadLane"/></svg>
    <svg class="rickshaw" id="rickshaw" viewBox="0 0 120 90" aria-hidden="true"><use href="#rickshawArt"/></svg>
    <div class="stops" id="stops"></div>
  </section>

  <section class="sec fade">
    <p class="label" data-i18n="saveDate"></p>
    <h2 class="title" data-i18n="countdown"></h2>
    <div class="plate-cd" data-cd-wrap>
      <p class="pc-city" data-i18n="metro"></p>
      <p class="pc-num"><b data-cd="d">0</b><small data-i18n="days"></small><span>-</span><b data-cd="h">00</b><small data-i18n="hours"></small><span>-</span><b data-cd="m">00</b><small data-i18n="minutes"></small></p>
    </div>
    <p class="done" data-cd-done hidden data-i18n="married"></p>
    <button class="btn" data-cal-main type="button">📅 <span data-i18n="addCal"></span></button>
  </section>

  <section class="sec fade">
    <figure class="photo"><img data-photo alt=""></figure>
  </section>

  <section class="sec fade" data-show="gallery">
    <p class="label" data-i18n="moments"></p>
    <div class="gallery" data-gallery></div>
  </section>

  <section class="sec fade" id="rsvpSec" data-show="rsvp">
    <p class="label" data-i18n="rsvp"></p>
    <h2 class="title" data-i18n="rsvpH"></h2>
    <p class="note" data-deadline></p>
    <form class="rsvp" id="rsvpForm" novalidate>
      <label><span data-i18n="yourName"></span><input name="name" maxlength="60" autocomplete="name"></label>
      <div class="choice">
        <label><input type="radio" name="attending" value="yes" checked><span data-i18n="accept"></span></label>
        <label><input type="radio" name="attending" value="no"><span data-i18n="decline"></span></label>
      </div>
      <label data-guests><span data-i18n="guests"></span>
        <select name="guests"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select>
      </label>
      <label><span data-i18n="wish"></span><textarea name="message" rows="3" maxlength="200"></textarea></label>
      <button class="btn" type="submit" data-i18n="send"></button>
      <p class="status" role="status"></p>
    </form>
  </section>

  <section class="sec fade end">
    <div class="contacts" data-contacts></div>
    <h2 class="title" data-i18n="thanks"></h2>
    <p class="msg" data-f="closing"></p>
    <p class="names small" data-f="couple"></p>
    <p class="tag" data-f="hashtag"></p>
    <p class="credit">Made with ♥ by <a id="brand" data-f="brand" href="https://shubhochithi.com/?ref=card" target="_blank" rel="noopener"></a> · <span class="lipighor-credit">Web font: <a href="https://lipighor.com" target="_blank" rel="noopener">lipighor.com</a></span></p>
  </section>
</main>

<script src="data.js"></script>
<script src="../shared/media.js?v=2"></script>
<script src="../shared/extras.js?v=2"></script>
<script src="../shared/core.js?v=2"></script>
<script src="app.js?v=1"></script>
</body>
</html>
